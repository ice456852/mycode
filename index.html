<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>我的小游戏</title>
  <!-- 必须引入这个官方脚本 -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--tg-theme-button-color, #5288c1);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin-bottom: 16px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .subtitle { font-size: 14px; opacity: 0.6; margin-bottom: 32px; }
    .score-box {
      background: var(--tg-theme-secondary-bg-color, #232e3c);
      border-radius: 16px;
      padding: 24px 40px;
      margin-bottom: 32px;
    }
    .score-label { font-size: 13px; opacity: 0.6; margin-bottom: 6px; }
    .score-value { font-size: 42px; font-weight: 700; }
    button {
      width: 100%;
      max-width: 280px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #5288c1);
      color: var(--tg-theme-button-text-color, #ffffff);
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    .tip { margin-top: 20px; font-size: 12px; opacity: 0.4; }
  </style>
</head>
<body>

  <div class="avatar" id="avatar">🎮</div>
  <h1 id="username">加载中...</h1>
  <p class="subtitle">欢迎来到我的小游戏</p>

  <div class="score-box">
    <div class="score-label">当前分数</div>
    <div class="score-value" id="score">0</div>
  </div>

  <button id="playBtn">点击加 1 分</button>
  <p class="tip" id="tip"></p>

  <script>
    // 1. 初始化 Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();          // 告诉 Telegram 页面已加载
      tg.expand();         // 展开到全屏
    }

    // 2. 获取用户信息
    const user = tg?.initDataUnsafe?.user;
    const usernameEl = document.getElementById('username');
    const avatarEl = document.getElementById('avatar');

    if (user) {
      // 显示用户名字
      usernameEl.textContent = user.first_name + (user.last_name ? ' ' + user.last_name : '');
      // 如果有头像，尝试加载；没有则显示首字母
      if (user.photo_url) {
        avatarEl.innerHTML = `<img src="${user.photo_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarEl.textContent = (user.first_name || '?').charAt(0).toUpperCase();
      }
    } else {
      usernameEl.textContent = '游客';
    }

    // 3. 简单的游戏逻辑：点按钮加分
    let score = 0;
    const scoreEl = document.getElementById('score');
    const playBtn = document.getElementById('playBtn');
    const tipEl = document.getElementById('tip');

    playBtn.addEventListener('click', () => {
      score++;
      scoreEl.textContent = score;

      // 轻微震动反馈（Telegram 支持时）
      tg?.HapticFeedback?.impactOccurred('light');

      // 每 10 分给个提示
      if (score % 10 === 0) {
        tipEl.textContent = `厉害！已经 ${score} 分了 🎉`;
        tg?.HapticFeedback?.notificationOccurred('success');
      }
    });

    // 4. 显示调试信息（可选，上线后可删）
    console.log('Telegram WebApp 是否可用:', !!tg);
    console.log('用户信息:', user);
  </script>
</body>
</html>
